            n=$(count)
            [ "$code" = 200 ] && [ "$n" = 0 ] && ok "control: own $p, HTTP 200, count 0" || bad "control: own $p, HTTP $code, count $n, errors [$(errs)]"
          done

          # Account list: exactly its own account
          code=$(cf /accounts)
