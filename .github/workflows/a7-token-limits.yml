          }

          # Inputs: present and the right shape (lengths only)
          echo "lengths: CLOUDFLARE_API_TOKEN ${#CF_TOKEN}, ALCHEMY_STATE_TOKEN ${#STATE_TOKEN}, ALCHEMY_PASSWORD ${#STATE_PASSWORD}, canary ${#CANARY}"
          [[ "$OWN_ID" =~ ^[0-9a-f]{32}$ ]] && ok "own account ID variable is set" || { bad "own account ID variable missing or malformed"; exit 1; }
          [ "$OWN_ID" != "$OTHER_ID" ] && ok "own and other account IDs differ" || bad "own and other account IDs are the same"
          [ -n "$CF_TOKEN" ] && ok "Cloudflare token is set" || { bad "Cloudflare token is empty"; exit 1; }
          [[ "$STATE_TOKEN" =~ ^[0-9a-f]{64}$ ]] && ok "state token is 64 hex characters" || bad "state token isn't 64 hex characters"
          [[ "$STATE_PASSWORD" =~ ^[0-9a-f]{64}$ ]] && ok "password is 64 hex characters" || bad "password isn't 64 hex characters"
          [[ "$CANARY" =~ ^[0-9a-f]{32}$ ]] && ok "canary is 32 hex characters" || bad "canary isn't 32 hex characters"

