          OTHER_ID: 055ad38b2af32a03965ad1535377f2e5
          STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}
          STATE_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
          CANARY: ${{ secrets.CANARY_PROD }}
        run: |
          set -u +e +o pipefail
