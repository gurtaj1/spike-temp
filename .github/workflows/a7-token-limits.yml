# Spike 2, stage A, A7. Checks what each Cloudflare account token can and can't reach.
# Prints HTTP codes, Cloudflare error codes, counts and yes/no only; never a response body,
# a token, or a secret's value (only secret lengths and whether they look right).
# The token reaches curl as a config line on stdin, never as a command-line argument.
name: a7-token-limits

on:
  workflow_dispatch:

permissions: {}

jobs:
  preview-token:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: preview
    steps:
      - name: Token limits (preview)
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OWN_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          OTHER_ID: 95de81a8645bb44f4997edd1d3e237af
          STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}
          STATE_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
          CANARY: ${{ secrets.CANARY_PREVIEW }}
        run: |
          set -u +e +o pipefail
          API=https://api.cloudflare.com/client/v4
          B=$(mktemp)
          PASS=0; FAIL=0
          ok() { PASS=$((PASS + 1)); echo "PASS  $1"; }
          bad() { FAIL=$((FAIL + 1)); echo "FAIL  $1"; }
          cf() {
            printf 'header = "Authorization: Bearer %s"\n' "$CF_TOKEN" |
              curl -q -sS -K - -o "$B" -w '%{http_code}' --max-time 30 "$API$1" 2>/dev/null
          }
          errs() { jq -r '[.errors[]?.code | tostring] | join(",")' "$B" 2>/dev/null || echo not-json; }
          count() { jq -r '.result | length' "$B" 2>/dev/null || echo none; }
          refused() {
            local e
            e=$(errs)
            case "$2" in
              401 | 403) ok "$1: refused, HTTP $2, errors [$e]" ;;
              2??) bad "$1: ALLOWED, HTTP $2, errors [$e]" ;;
              *)
                case ",$e," in
                  *,9109,* | *,10000,*) ok "$1: refused, HTTP $2, errors [$e]" ;;
                  *) bad "$1: unexpected HTTP $2, errors [$e]" ;;
                esac
                ;;
            esac
          }

          # Inputs: present and the right shape (lengths only)
          echo "lengths: CLOUDFLARE_API_TOKEN ${#CF_TOKEN}, ALCHEMY_STATE_TOKEN ${#STATE_TOKEN}, ALCHEMY_PASSWORD ${#STATE_PASSWORD}, canary ${#CANARY}"
          [[ "$OWN_ID" =~ ^[0-9a-f]{32}$ ]] && ok "own account ID variable is set" || { bad "own account ID variable missing or malformed"; exit 1; }
          [ "$OWN_ID" != "$OTHER_ID" ] && ok "own and other account IDs differ" || bad "own and other account IDs are the same"
          [ -n "$CF_TOKEN" ] && ok "Cloudflare token is set" || { bad "Cloudflare token is empty"; exit 1; }
          [[ "$STATE_TOKEN" =~ ^[0-9a-f]{64}$ ]] && ok "state token is 64 hex characters" || bad "state token isn't 64 hex characters"
          [[ "$STATE_PASSWORD" =~ ^[0-9a-f]{64}$ ]] && ok "password is 64 hex characters" || bad "password isn't 64 hex characters"
          [[ "$CANARY" =~ ^[0-9a-f]{32}$ ]] && ok "canary is 32 hex characters" || bad "canary isn't 32 hex characters"

          # Controls: the token works on its own account
          code=$(cf "/accounts/$OWN_ID/tokens/verify")
          st=$(jq -r '.result.status // "none"' "$B" 2>/dev/null)
          nb=$(jq -r '.result.not_before // "none"' "$B" 2>/dev/null)
          ex=$(jq -r '.result.expires_on // "none"' "$B" 2>/dev/null)
          # "active" alone isn't enough: a token whose not_before is in the future verifies as
          # active but is refused everywhere else. ISO 8601 UTC times compare as strings.
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          valid=yes
          [ "$nb" = none ] || [[ ! "$nb" > "$now" ]] || valid=no
          [ "$ex" = none ] || [[ "$ex" > "$now" ]] || valid=no
          if [ "$code" = 200 ] && [ "$st" = active ] && [ "$valid" = yes ]; then
            ok "control: own account token verify, HTTP 200, status active, valid at $now, not_before $nb, expires_on $ex"
          else
            bad "control: own account token verify, HTTP $code, status $st, valid at $now: $valid, errors [$(errs)], not_before $nb, expires_on $ex"
            echo "STOPPED: the token can't be used now, so the refusals below would test nothing."
            exit 1
          fi
          for p in workers/scripts d1/database; do
            code=$(cf "/accounts/$OWN_ID/$p")
            n=$(count)
            [ "$code" = 200 ] && [ "$n" = 0 ] && ok "control: own $p, HTTP 200, count 0" || bad "control: own $p, HTTP $code, count $n, errors [$(errs)]"
          done

          # Account list: exactly its own account
          code=$(cf /accounts)
          n=$(count)
          m=$(jq -r --arg id "$OWN_ID" 'if [.result[]?.id] == [$id] then "yes" else "no" end' "$B" 2>/dev/null)
          [ "$code" = 200 ] && [ "$n" = 1 ] && [ "$m" = yes ] && ok "GET /accounts: HTTP 200, 1 account, its own" || bad "GET /accounts: HTTP $code, count $n, only its own: $m, errors [$(errs)]"

          # The other account: refused
          code=$(cf "/accounts/$OTHER_ID"); refused "other account" "$code"
          code=$(cf "/accounts/$OTHER_ID/workers/scripts"); refused "other account workers/scripts" "$code"
          code=$(cf "/accounts/$OTHER_ID/d1/database"); refused "other account d1/database" "$code"

          # User scope: refused
          code=$(cf /user); refused "GET /user" "$code"
          code=$(cf /user/tokens/verify); refused "GET /user/tokens/verify" "$code"

          # Zones: 200 with none, or refused; either is fine
          code=$(cf /zones)
          n=$(count)
          case "$code" in
            200) [ "$n" = 0 ] && ok "GET /zones: HTTP 200, 0 zones" || bad "GET /zones: HTTP 200, $n zones" ;;
            *) refused "GET /zones" "$code" ;;
          esac

          rm -f "$B"
          echo "$PASS passed, $FAIL failed"
          [ "$FAIL" = 0 ]

  prod-token:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    steps:
      - name: Token limits (production)
        shell: bash
