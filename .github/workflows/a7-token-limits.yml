          code=$(cf "/accounts/$OWN_ID/tokens/verify")
          st=$(jq -r '.result.status // "none"' "$B" 2>/dev/null)
          nb=$(jq -r '.result.not_before // "none"' "$B" 2>/dev/null)
          ex=$(jq -r '.result.expires_on // "none"' "$B" 2>/dev/null)
