          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          valid=yes
          [ "$nb" = none ] || [[ ! "$nb" > "$now" ]] || valid=no
          [ "$ex" = none ] || [[ "$ex" > "$now" ]] || valid=no
          if [ "$code" = 200 ] && [ "$st" = active ] && [ "$valid" = yes ]; then
            ok "control: own account token verify, HTTP 200, status active, valid at $now, not_before $nb, expires_on $ex"
          else
            bad "control: own account token verify, HTTP $code, status $st, valid at $now: $valid, errors [$(errs)], not_before $nb, expires_on $ex"
            echo "STOPPED: the token can't be used now, so the refusals below would test nothing."
            exit 1
          fi
          for p in workers/scripts d1/database; do
