# Stage C scaffolding: deploys or destroys the pr-0 stack in the preview account from
# main. Stage D replaces it with the real PR preview pipeline.
name: preview-smoke

on:
  workflow_dispatch:
    inputs:
      action:
        description: deploy or destroy
        type: choice
        options:
          - deploy
          - destroy
        required: true

permissions: {}

concurrency:
  group: preview-smoke
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install
        working-directory: app
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build
        working-directory: app
        run: bash scripts/build.sh
      - name: Validate
        working-directory: app
        run: bash scripts/validate-dist.sh "$PWD/dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-dist
          path: app/dist/
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview
    permissions:
      contents: read
    steps:
      - name: Check the input
        env:
          ACTION: ${{ inputs.action }}
        run: |
          [[ "$ACTION" == deploy || "$ACTION" == destroy ]] || { echo "action must be deploy or destroy"; exit 1; }
          echo "action: $ACTION"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install
        working-directory: app
        run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: preview-dist
          path: ${{ runner.temp }}/dist
      - name: Validate the downloaded build
        working-directory: app
        run: bash scripts/validate-dist.sh "$RUNNER_TEMP/dist"
      - name: Deploy or destroy
        working-directory: app
        env:
          ACTION: ${{ inputs.action }}
          STAGE: pr-0
          ALCHEMY_TELEMETRY_DISABLED: "1"
          DO_NOT_TRACK: "1"
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}
          ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]] || { echo "bad account ID"; exit 1; }
          case "$ACTION" in
            deploy) DIST_DIR="$RUNNER_TEMP/dist" bun ./alchemy.run.ts ;;
            destroy) DIST_DIR="$RUNNER_TEMP/dist" bun ./alchemy.run.ts --destroy ;;
            *) echo "bad action"; exit 1 ;;
          esac
      - name: Check the deployed app
        if: inputs.action == 'deploy'
        env:
          BASE: https://spike2-app-pr-0.spike2-preview.workers.dev
        run: |
          set -uo pipefail
          for i in $(seq 1 18); do
            code=$(curl -q -s -o /dev/null -w '%{http_code}' --max-time 10 "$BASE/")
            [ "$code" = 200 ] && break
            sleep 5
          done
          fail=0
          for path in / /api/count; do
            hdrs=$(curl -q -s -D - -o /dev/null --max-time 10 "$BASE$path")
            code=$(printf '%s\n' "$hdrs" | head -1 | awk '{print $2}')
            noindex=$(printf '%s\n' "$hdrs" | grep -ci '^x-robots-tag: *noindex' || true)
            echo "$path: HTTP $code, X-Robots-Tag noindex headers: $noindex"
            [ "$code" = 200 ] && [ "$noindex" = 1 ] || fail=1
          done
          [ "$fail" = 0 ] && echo "preview check: pass" || { echo "preview check: FAIL"; exit 1; }
