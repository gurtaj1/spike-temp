# Stage C: lists the Worker scripts and D1 databases in each Cloudflare account, with
# counts. Names only: they're all ours. The preview job runs from main, the production job
# only from a release-* tag (the environments enforce the same).
name: c-readback

on:
  workflow_dispatch:

permissions: {}

jobs:
  preview:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: preview
    permissions: {}
    steps:
      - name: List Workers and D1 databases
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -uo pipefail
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]] || { echo "bad account ID"; exit 1; }
          body=$(mktemp)
          fail=0
          for kind in workers/scripts d1/database; do
            code=$(printf 'header = "Authorization: Bearer %s"\n' "$CLOUDFLARE_API_TOKEN" |
              curl -q -s -K - -o "$body" -w '%{http_code}' --max-time 30 \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/$kind?per_page=100")
            if [ "$code" != 200 ]; then
              echo "$kind: HTTP $code"
              fail=1
              continue
            fi
            case $kind in
              workers/scripts) names=$(jq -r '[.result[].id] | sort | join(",")' "$body") ;;
              d1/database) names=$(jq -r '[.result[].name] | sort | join(",")' "$body") ;;
            esac
            count=$(jq -r '.result | length' "$body")
            echo "$kind: HTTP $code, count $count: $names"
          done
          rm -f "$body"
          exit "$fail"

  production:
    if: startsWith(github.ref, 'refs/tags/release-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    permissions: {}
    steps:
      - name: List Workers and D1 databases
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -uo pipefail
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]] || { echo "bad account ID"; exit 1; }
          body=$(mktemp)
          fail=0
          for kind in workers/scripts d1/database; do
            code=$(printf 'header = "Authorization: Bearer %s"\n' "$CLOUDFLARE_API_TOKEN" |
              curl -q -s -K - -o "$body" -w '%{http_code}' --max-time 30 \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/$kind?per_page=100")
            if [ "$code" != 200 ]; then
              echo "$kind: HTTP $code"
              fail=1
              continue
            fi
            case $kind in
              workers/scripts) names=$(jq -r '[.result[].id] | sort | join(",")' "$body") ;;
              d1/database) names=$(jq -r '[.result[].name] | sort | join(",")' "$body") ;;
            esac
            count=$(jq -r '.result | length' "$body")
            echo "$kind: HTTP $code, count $count: $names"
          done
          rm -f "$body"
          exit "$fail"
