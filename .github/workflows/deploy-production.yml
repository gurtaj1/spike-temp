# Stage C (D15): deploys production from a release-* tag, and only from one whose commit
# is on main. The build job has no secrets; the deploy job uploads the prebuilt files
# without running them (Alchemy v1, noBundle).
name: deploy-production

on:
  push:
    tags:
      - "release-*"

permissions: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install
        working-directory: app
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build
        working-directory: app
        run: bash scripts/build.sh
      - name: Validate
        working-directory: app
        run: bash scripts/validate-dist.sh "$PWD/dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prod-dist
          path: app/dist/
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    steps:
      - name: Check the tagged commit is on main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$REPO" == "gurtaj1/spike-temp" ]] || { echo "unexpected repository"; exit 1; }
          [[ "$REF" =~ ^refs/tags/release-[A-Za-z0-9._-]+$ ]] || { echo "not a release-* tag"; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "bad commit SHA"; exit 1; }
          body=$(mktemp)
          code=$(printf 'header = "Authorization: Bearer %s"\n' "$GH_TOKEN" |
            curl -q -s -K - -o "$body" -w '%{http_code}' --max-time 30 \
              -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$REPO/compare/main...$SHA")
          echo "compare: HTTP $code"
          [ "$code" = 200 ] || exit 1
          status=$(jq -r .status "$body")
          rm -f "$body"
          echo "commit $SHA vs main: $status"
          [[ "$status" == behind || "$status" == identical ]] || { echo "the tagged commit isn't on main"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install
        working-directory: app
        run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prod-dist
          path: ${{ runner.temp }}/dist
      - name: Validate the downloaded build
        working-directory: app
        run: bash scripts/validate-dist.sh "$RUNNER_TEMP/dist"
      - name: Deploy
        working-directory: app
        env:
          STAGE: prod
          ALCHEMY_TELEMETRY_DISABLED: "1"
          DO_NOT_TRACK: "1"
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}
          ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]] || { echo "bad account ID"; exit 1; }
          DIST_DIR="$RUNNER_TEMP/dist" bun ./alchemy.run.ts
      - name: Check the deployed app
        env:
          BASE: https://spike2-app-prod.spike2-prod.workers.dev
        run: |
          set -uo pipefail
          # A new workers.dev name can take minutes to go live: wait up to 5 minutes for /
          for i in $(seq 1 60); do
            code=$(curl -q -s -o /dev/null -w '%{http_code}' --max-time 10 "$BASE/")
            [ "$code" = 200 ] && break
            sleep 5
          done
          echo "waited about $((i * 5)) s for / (last HTTP $code)"
          fail=0
          for path in / /api/count; do
            hdrs=$(curl -q -s -D - -o /dev/null --max-time 10 "$BASE$path")
            code=$(printf '%s\n' "$hdrs" | head -1 | awk '{print $2}')
            robots=$(printf '%s\n' "$hdrs" | grep -ci '^x-robots-tag:' || true)
            echo "$path: HTTP $code, X-Robots-Tag headers: $robots"
            [ "$code" = 200 ] && [ "$robots" = 0 ] || fail=1
          done
          [ "$fail" = 0 ] && echo "production check: pass" || { echo "production check: FAIL"; exit 1; }
